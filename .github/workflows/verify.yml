name: Verify
on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        options: [both, android, ios]
        default: both
      native_tests:
        description: Include the unchanged Swift brightness lifecycle tests
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  flutter:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Preserve the simulator app before the test runner replaces it
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/amber-night-simulator.zip"
      - name: Boot an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in reversed(list(d["devices"].items())) if "iOS" in runtime for x in devices if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test native iOS brightness restoration on lifecycle changes
        if: github.event_name != 'workflow_dispatch' || inputs.native_tests
        run: xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "id=$IOS_DEVICE_ID" -parallel-testing-enabled NO -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO -quiet
      - name: Run the complete 30-second fade on iOS
        run: |
          xcrun simctl bootstatus "$IOS_DEVICE_ID" -b
          flutter test integration_test/night_flow_test.dart -d "$IOS_DEVICE_ID"
      - name: Compile the iPhone release build without signing
        run: flutter build ios --release --no-codesign
      - name: Package the unsigned iPhone build
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "$RUNNER_TEMP/amber-night-iphone-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/amber-night-simulator.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ios-iphone-unsigned-not-installable
          path: ${{ runner.temp }}/amber-night-iphone-unsigned.zip
          retention-days: 7
